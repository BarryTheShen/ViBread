name: Windows server smoke

on:
  push:
    branches: [main]
    # Only what the Claude connect flow and server start-up depend on, so unrelated pushes don't re-run it.
    paths:
      - "apps/server/src/claude/**"
      - "apps/server/src/start.ts"
      - "apps/server/src/main.ts"
      - "apps/server/src/config.ts"
      - "apps/server/package.json"
      - "scripts/ci/claude-connect-smoke.mjs"
      - ".github/workflows/windows-server-smoke.yml"
  workflow_dispatch:

jobs:
  server-smoke:
    name: Claude connect flow (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PORT: "8787"
      ORIGIN: "http://localhost:8787"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set data directory
        shell: pwsh
        run: |
          # The runner context isn't available in job-level env, so DATA_DIR is set here.
          "DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'vb-data')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # One step on purpose: on Windows runners a process started in one step doesn't survive into the next, which is
      # why the earlier split start/wait steps saw the server "exit" silently.
      - name: Start the server and run the Claude connect smoke
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "vibread-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "vibread-server.stderr.log"
          $serverJson = Join-Path $env:DATA_DIR "logs\server.jsonl"
          $env:SERVER_LOG = $stdout
          $env:SERVER_ERROR_LOG = $stderr
          function Show-Logs {
            foreach ($log in @($stdout, $stderr, $serverJson)) {
              if (Test-Path $log) {
                Write-Host "--- $log (tail) ---"
                Get-Content -Path $log -Tail 150
              }
            }
          }
          # Same launch as the desktop app: one node process running the server entry through tsx.
          $server = Start-Process -FilePath "node" -ArgumentList @("--import", "tsx", "src/start.ts") -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE "apps\server") -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $server.Handle  # keeps the handle so ExitCode is readable after an early exit
          try {
            $uri = "http://localhost:$env:PORT/api/missions"
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            $ready = $false
            while (-not $ready -and [DateTime]::UtcNow -lt $deadline) {
              if ($server.HasExited) {
                Show-Logs
                throw "Server exited with code $($server.ExitCode) before GET $uri returned 200"
              }
              try {
                $ready = (Invoke-WebRequest -UseBasicParsing -Uri $uri -Method Get -TimeoutSec 5).StatusCode -eq 200
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Show-Logs
              throw "Timed out waiting for GET $uri -> 200"
            }
            Write-Host "Server is ready: GET $uri -> 200"
            node scripts/ci/claude-connect-smoke.mjs
            if ($LASTEXITCODE -ne 0) {
              Show-Logs
              throw "Claude connect smoke failed (exit $LASTEXITCODE)"
            }
          } finally {
            if (-not $server.HasExited) {
              & taskkill.exe /PID $server.Id /T /F | Out-Host
            }
          }
