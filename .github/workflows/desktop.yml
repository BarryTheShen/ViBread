name: Desktop app

on:
  push:
    branches: [desktop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS apps (macOS runners cost ~10× the minutes; pushes build Linux + Windows only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Each run gets its own app version (installer names, About box, release tag): 0.1.<run number>.
  APP_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      labels: ${{ steps.plan.outputs.labels }}
    steps:
      - id: plan
        env:
          WANT_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
        run: |
          platforms='[{"os":"ubuntu-latest","label":"linux-x64","builder":"--linux AppImage deb","optional":false},{"os":"windows-latest","label":"windows-x64","builder":"--win nsis","optional":false}]'
          if [ "$WANT_MACOS" = "true" ]; then
            platforms=$(jq -c '. + [{"os":"macos-14","label":"macos-arm64","builder":"--mac dmg zip","optional":true},{"os":"macos-15-intel","label":"macos-x64","builder":"--mac dmg zip","optional":true}]' <<<"$platforms")
          fi
          echo "matrix={\"include\":$platforms}" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r 'map(.label) | join(" ")' <<<"$platforms")" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r 'map(.label) | join(", ")' <<<"$platforms")"

  package:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      # Linux and Windows gate the release. macOS legs (only on request) are best effort: a failure never blocks publishing.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm

      # Windows Defender scans every file npm, electron-builder and the toolchain unpack; the runner is throwaway.
      - name: Windows — pause real-time scanning (speed)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Electron + electron-builder tool downloads (NSIS, AppImage, Electron zips) and the bundled Node download.
      - name: Cache Electron and runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            apps/desktop/.cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/stage-runtime.mjs') }}

      # Arduino core archives for the first-run smoke (VIBREAD_TOOLCHAIN_CACHE, see scripts/setup-toolchain.mjs).
      - name: Cache Arduino core downloads
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain-cache
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-toolchain.mjs') }}

      - name: Linux display + packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install (native modules built for this runner)
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set app version
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set version="$APP_VERSION" && echo "Packaging ViBread $APP_VERSION"

      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          node ../../node_modules/electron/install.js
          node scripts/build.mjs
          node scripts/stage-runtime.mjs
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.builder }} --publish never
          ls -la release

      - name: Smoke (first run + server + renderer + screenshots)
        shell: bash
        env:
          VIBREAD_USER_DATA: ${{ runner.temp }}/vibread-smoke
          VIBREAD_SMOKE_DIR: ${{ github.workspace }}/smoke
          VIBREAD_TOOLCHAIN_CACHE: ${{ runner.temp }}/toolchain-cache
        run: node apps/desktop/scripts/smoke-packaged.mjs

      - name: Save Arduino core downloads for the next run
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/toolchain-cache/packages"
          cp -r "${{ runner.temp }}/vibread-smoke/toolchain/arduino/downloads/packages/." "${{ runner.temp }}/toolchain-cache/packages/" || true
          ls -la "${{ runner.temp }}/toolchain-cache/packages"

      - name: Collect logs
        if: always()
        shell: bash
        run: mkdir -p smoke/logs && cp -r "${{ runner.temp }}/vibread-smoke/logs/." smoke/logs/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibread-${{ matrix.label }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            smoke/
          if-no-files-found: warn

  release:
    name: Publish desktop release
    needs: [plan, package]
    # Runs on main (push or workflow_dispatch) once Linux and Windows passed; optional macOS legs may have failed.
    if: github.ref == 'refs/heads/main' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Checked out only for git credentials: the release tag is pushed with git (see below).
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Publish desktop-v${{ env.APP_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          set -euo pipefail
          mkdir upload
          missing=""
          # Attach a platform's installers only when its packaged-app smoke test passed.
          for dir in artifacts/vibread-*; do
            label="${dir#artifacts/vibread-}"
            if [ -f "$dir/smoke/smoke.json" ] && jq -e '.ok == true' "$dir/smoke/smoke.json" >/dev/null; then
              find "$dir" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} upload/ \;
            else
              missing="$missing $label"
            fi
          done
          # Platforms planned for this run that left no artifact at all (the job died before uploading).
          for label in $PLANNED_LABELS; do
            [ -d "artifacts/vibread-$label" ] || missing="$missing $label"
          done
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -la upload
          mac_note=""
          if ! ls upload/*.dmg >/dev/null 2>&1; then
            last_mac=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.tag_name | startswith("desktop-v")) | select(any(.assets[]; .name | endswith(".dmg")))] | sort_by(.created_at) | reverse | .[0].html_url // ""')
            mac_note="macOS apps are built on request (Actions → Desktop app → Run workflow → macOS)."
            if [ -n "$last_mac" ]; then mac_note="$mac_note Newest macOS build: $last_mac"; fi
          fi
          {
            printf 'ViBread desktop %s, built from %s on %s\n\n' "$APP_VERSION" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'Unsigned preview builds of the ViBread desktop app. See the README "Desktop app" section for first-run steps.\n'
            if [ -n "$mac_note" ]; then printf '\n%s\n' "$mac_note"; fi
            if [ -n "$missing" ]; then
              printf '\nNot in this build (packaging or smoke test failed, see %s/%s/actions/runs/%s):%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$missing"
            fi
          } > notes.md
          cat notes.md
          tag="desktop-v$APP_VERSION"
          # GitHub refuses to let the Actions token create a tag (by API or git push) at a commit whose workflow files
          # differ from the default branch ("... without `workflows` permission"). That only happens when main has moved
          # on with a workflow change after this build started — the newer run publishes, so this one steps aside.
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::notice::Not publishing $tag: main's workflow files changed after this build started; the newer desktop build publishes instead."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          # Every successful build is a new release with its own version; the newest is marked Latest.
          gh release create "$tag" upload/* --verify-tag --latest --repo "$GITHUB_REPOSITORY" \
            --title "ViBread desktop $APP_VERSION" --notes-file notes.md
          # Keep the five newest desktop builds plus the newest one with macOS apps (best effort: a cleanup hiccup must
          # not fail a published release).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            [.[] | select(.tag_name | startswith("desktop-v"))] | sort_by(.created_at) | reverse
            | ([.[] | select(any(.assets[]; .name | endswith(".dmg")))] | .[0].tag_name // "") as $mac
            | .[5:] | map(select(.tag_name != $mac)) | .[].tag_name' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "couldn't remove $old"; done
